# -----------------------------------------------------------------------------
# 10. ingest-db: ingest's PRIVATE PostgreSQL database. 11-analyzer-db.yaml and
# 12-api-db.yaml are identical apart from names, sizes and credentials; if you
# change one, change all three.
#
# A database is the classic StatefulSet case: it needs a stable identity
# (ingest-db-0) and its own disk that survives pod restarts. Compare the
# stateless Deployments in 30-33, whose pods are interchangeable.
# -----------------------------------------------------------------------------

# Headless Service (clusterIP: None): no virtual IP and no load balancing, just a
# DNS name. "ingest-db" resolves straight to the pod's IP, and the pod also gets
# the stable name ingest-db-0.ingest-db. Only ingest is given this address and
# the password; the other services never learn them.
apiVersion: v1
kind: Service
metadata:
  name: ingest-db
  labels:
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app: ingest-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ingest-db
  labels:
    app.kubernetes.io/component: database
spec:
  serviceName: ingest-db          # must match the headless Service above
  replicas: 1                     # a single primary; high availability is future work (Cloud SQL HA)
  selector:
    matchLabels:
      app: ingest-db
  template:
    metadata:
      labels:
        app: ingest-db
        tier: database            # lets the anti-affinity below spread ALL databases apart
    spec:
      # Wait up to a minute so Postgres can shut down cleanly instead of being
      # killed mid-write when the pod is stopped or moved.
      terminationGracePeriodSeconds: 60

      # Run as postgres' own non-root user (uid/gid 999 in the official image).
      # fsGroup makes Kubernetes give that group write access to the mounted disk;
      # without it the "Permission denied" problem from Assignment 2 returns
      # (the disk arrives owned by root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      # Prefer different nodes for the three databases, so draining one node
      # takes down at most one database (the failure-isolation demo relies on it).
      # "preferred" = a soft rule: if nodes are scarce they may still share one.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    tier: database

      containers:
        - name: postgres
          image: postgres:17      # pinned major version (Postgres 18 changed the data directory layout)
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: ingest
            - name: POSTGRES_DB
              value: ingest
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ingest-db-credentials   # created by scripts/k8s/create-secrets.sh
                  key: password
            # A brand-new cloud disk contains a "lost+found" folder at its root, which
            # makes Postgres's initdb refuse to start (also from Assignment 2). Keeping
            # the data in a SUBDIRECTORY of the mount avoids it.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:             # what the scheduler reserves for it
              cpu: 50m
              memory: 256Mi
            limits:               # the most it may use
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # pg_isready asks Postgres "are you accepting connections?". Not-ready
          # pods are removed from the Service; failing liveness restarts the container.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ingest", "-d", "ingest"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "ingest", "-d", "ingest"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

  # Each pod gets its OWN disk, created from this template (ingest-db-0 gets a
  # PersistentVolumeClaim called data-ingest-db-0). It stays when the pod is
  # deleted or rescheduled, which is what makes the data persistent.
  # No storageClassName: the cluster's default is used (pd-balanced on GKE).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]    # mounted read-write by one node at a time
        resources:
          requests:
            storage: 5Gi                  # ~135k seeded results are ~50 MB; the rest is headroom for the load test
