# The "front door" for the Compose stack. It does what the GKE Ingress will do
# in the cloud - one address, routed by URL path - so the app is exercised the
# same way locally as when deployed:
#
#     /api/     -> api service       (the dashboard's API)
#     /ingest/  -> ingest service    (where CI posts results; needs the API key)
#     /         -> web service       (the dashboard itself)
#
# /internal/* is deliberately NOT routed to ingest or analyzer: it falls through
# to "/" (the web service), so the services' private endpoints stay reachable
# only from inside the Docker network, just as they are inside the cluster.

# Docker's built-in DNS server. Combined with the `set $variable` trick below,
# nginx re-resolves each service name every second instead of once at startup,
# so it keeps working (and keeps balancing across replicas) when a container is
# restarted, scaled or killed and its IP address changes or disappears.
resolver 127.0.0.11 valid=1s ipv6=off;

server {
    listen 8080;

    # ingest accepts bodies up to 5 MB (see Section 9.1 of the plan); nginx's default limit is 1 MB.
    client_max_body_size 5m;

    # Answers for the proxy itself (used by the Compose health check).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    location /ingest/ {
        set $upstream http://ingest:8080;
        proxy_pass $upstream;
        include /etc/nginx/proxy-headers.conf;
    }

    location / {
        set $upstream http://web:8080;
        proxy_pass $upstream;
        include /etc/nginx/proxy-headers.conf;
    }
}
