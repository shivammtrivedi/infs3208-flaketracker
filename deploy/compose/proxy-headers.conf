# Headers added to every request the proxy forwards (included by proxy.nginx.conf).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# Connecting to a container on the same machine takes milliseconds. A short
# timeout means a request that lands on a just-killed replica fails over to a
# healthy one in about a second instead of hanging.
proxy_connect_timeout 1s;
proxy_read_timeout    30s;
