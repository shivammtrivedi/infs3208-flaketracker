# nginx config for the web container: it serves the built React app and nothing
# else. API traffic never reaches it - the Ingress (cloud) or the proxy
# container (Compose) sends /api/ and /ingest/ to the other services.
server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Health check for Kubernetes probes, the load balancer and Compose.
    # It answers 200 without touching any files, and isn't logged (it's polled constantly).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite puts a content hash in these file names (index-DnQ8o5wY.js), so a
    # given URL never changes and browsers can cache it for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app. React Router decides what to show
    # for /tests/30 or /runs, but the server has no such files, so it falls back
    # to index.html. That file is never cached, so a new deploy shows up at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
